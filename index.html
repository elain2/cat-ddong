<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고양이 사랑방</title>
  <meta name="description" content="설문 하나로 만나는 나만의 픽셀 고양이. 찾아온 손님 고양이를 모아 보세요.">

  <!-- 링크 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="고양이 사랑방">
  <meta property="og:title" content="고양이 사랑방">
  <meta property="og:description" content="설문 하나로 만나는 나만의 픽셀 고양이. 찾아온 손님 고양이를 모아 보세요.">
  <meta property="og:url" content="https://elain2.github.io/cat-ddong/">
  <meta property="og:image" content="https://elain2.github.io/cat-ddong/docs/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="턱시도 집사 고양이와 손님 고양이들">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="고양이 사랑방">
  <meta name="twitter:description" content="설문 하나로 만나는 나만의 픽셀 고양이.">
  <meta name="twitter:image" content="https://elain2.github.io/cat-ddong/docs/og.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
  <style>
    :root {
      --ink: #2b2333;
      --paper: #fff3e0;
      --card: #fffaf0;
      --accent: #f2a64e;
      --pink: #f7a8b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      background-image: radial-gradient(#f0dcc0 1.5px, transparent 1.5px);
      background-size: 16px 16px;
      color: var(--ink);
      font-family: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', monospace;
      line-height: 1.5;
    }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; text-align: center; margin: 0 0 16px; }
    canvas { image-rendering: pixelated; }

    .butler { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
    #butler { width: 96px; height: 96px; flex: none; }
    .bubble {
      position: relative; flex: 1; min-height: 56px;
      background: var(--card); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
      padding: 10px 12px; font-size: 15px;
    }
    .bubble::before {
      content: ''; position: absolute; left: -11px; bottom: 14px;
      width: 12px; height: 12px; background: var(--card);
      border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
      transform: rotate(45deg);
    }

    #screen { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      font: inherit; font-size: 15px; text-align: left; cursor: pointer; color: var(--ink);
      background: var(--accent); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
      padding: 10px 14px;
    }
    .btn.opt { background: var(--card); }
    .btn.ghost { background: var(--card); }
    .btn.skip { font-size: 13px; text-align: center; opacity: 0.85; margin-top: 4px; }
    .btn:hover { transform: translate(-1px, -1px); }
    .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .input {
      font: inherit; font-size: 15px; padding: 10px 12px; color: var(--ink);
      background: var(--card); border: 3px solid var(--ink);
    }
    .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 4px; }
    .dot { width: 10px; height: 10px; border: 2px solid var(--ink); background: var(--card); }
    .dot.on { background: var(--ink); }
    .loading { text-align: center; font-size: 28px; padding: 32px 0; animation: blink 0.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    .card {
      background: var(--card); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
      padding: 16px; text-align: center;
    }
    .cat { width: 256px; height: 256px; max-width: 100%; aspect-ratio: 1; }
    .card h2 { margin: 4px 0 0; font-size: 24px; }
    .title { margin: 0 0 4px; color: #b8662a; }
    .owner { margin: 0 0 8px; font-size: 13px; color: #a89878; min-height: 0; }
    .owner:empty { display: none; }
    .tags { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
    .tag { border: 2px solid var(--ink); padding: 0 8px; font-size: 13px; background: var(--pink); }
    .reasons { list-style: none; padding: 0; margin: 0; text-align: left; font-size: 14px; }
    .reasons li { padding: 6px 0; border-top: 2px dashed #e0c9a6; }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; text-align: center; }

    .room {
      width: 100%; aspect-ratio: 240 / 176; display: block; cursor: pointer;
      border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    }
    .stage {
      width: 100%; max-width: 360px; aspect-ratio: 9 / 16; display: block; margin: 0 auto;
      border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); background: #fff;
      image-rendering: pixelated;
    }
    .stage-note { font-size: 12px; color: #a89878; text-align: center; margin: 0; min-height: 18px; }
    .snack {
      display: flex; gap: 10px; align-items: center; justify-content: space-between;
      background: var(--card); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
      padding: 6px 8px 6px 12px; font-size: 14px;
    }
    .snack-btn { font-size: 14px; padding: 4px 12px; box-shadow: 2px 2px 0 var(--ink); }
    .snack-btn:disabled { background: #e8dcc6; cursor: default; transform: none; }
    .room.sticky { position: sticky; top: 8px; z-index: 20; }   /* 인테리어를 편집하는 동안 방을 계속 보여 준다 */
    .seasons { display: flex; gap: 8px; justify-content: center; }
    .chip {
      font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
      background: var(--card); border: 2px solid var(--ink); padding: 2px 12px;
    }
    .chip.on { background: var(--accent); }
    .book-title { margin: 0 0 10px; font-size: 16px; }
    .backup summary { cursor: pointer; font-size: 15px; }
    .backup .code {
      width: 100%; margin: 8px 0; padding: 8px; font: 12px/1.4 monospace; color: var(--ink);
      background: #fff; border: 2px solid var(--ink); resize: vertical;
    }
    .interior-body { display: flex; flex-direction: column; gap: 4px; }
    .irow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .irow b { font-size: 13px; min-width: 56px; }
    .chip:disabled { opacity: 0.55; cursor: default; }
    .btn.locked { opacity: 0.7; }
    .gift-actions { margin-top: 10px; justify-content: flex-end; }
    .gift-slot { cursor: pointer; }
    .gift-slot:hover canvas { transform: translateY(-2px); }
    .slot.worn { outline: 3px solid var(--accent); outline-offset: 1px; background: #fff0d0; }
    .book-hint { margin: -4px 0 10px; font-size: 12px; color: #a89878; }
    .book { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .slot { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #a89878; }
    .slot.got { color: var(--ink); }
    .slot canvas { width: 100%; max-width: 64px; aspect-ratio: 1; }
  </style>
</head>
<body>
  <main>
    <h1>🐾 고양이 사랑방</h1>
    <section class="butler">
      <canvas id="butler" width="32" height="32"></canvas>
      <div class="bubble" id="bubble"></div>
    </section>
    <section id="screen"></section>
  </main>
  <script src="src/survey.js"></script>
  <script src="src/cat.js"></script>
  <script src="src/gif.js"></script>
  <script src="src/render.js"></script>
  <script src="src/interior.js"></script>
  <script src="src/room.js"></script>
  <script src="src/showcase.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
